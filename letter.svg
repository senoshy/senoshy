<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" width="620" height="600">
<g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP','Noto Sans CJK JP','Meiryo',sans-serif" font-size="18" style="writing-mode:vertical-rl;text-orientation:upright" fill="#ffffff" letter-spacing="0">
<text x="600" y="20" writing-mode="vertical-rl">岡部りん太郎さま</text>
<text x="569" y="20" writing-mode="vertical-rl">おひさしぶりです。あまねすずはです。はしだタイダーの娘です。</text>
<text x="538" y="20" writing-mode="vertical-rl">あなたにとっては、つい数時間前以来のことかもしれない。</text>
<text x="507" y="20" writing-mode="vertical-rl">今は、西暦二〇〇〇年の、6月13日です。</text>
<text x="476" y="20" writing-mode="vertical-rl">これをあなたが読んでいる、だいたい10年前ということになります。</text>
<text x="445" y="20" writing-mode="vertical-rl">結論だけ、書く。</text>
<g fill="#e60012">
<text x="414" y="20" writing-mode="vertical-rl">失敗した失敗した失敗した失敗した失敗した失敗した失敗した</text>
<text x="383" y="20" writing-mode="vertical-rl">失敗した失敗した失敗した失敗した失敗した失敗した失敗した</text>
<text x="352" y="20" writing-mode="vertical-rl">失敗した失敗した失敗した失敗した失敗した失敗した</text>
<text x="321" y="20" writing-mode="vertical-rl">あたしは失敗した失敗した失敗した失敗した失敗した</text>
<text x="290" y="20" writing-mode="vertical-rl">あたしは失敗した失敗した失敗した失敗したあたしは失敗した</text>
</g>
<text x="259" y="20" writing-mode="vertical-rl">今は、西暦二〇〇〇年の、6月14日です。</text>
<text x="228" y="20" writing-mode="vertical-rl">これをあなたが読んでいる、だいたい9年前、10年前になります。</text>
<text x="197" y="20" writing-mode="vertical-rl">失敗した。</text>
<text x="166" y="20" writing-mode="vertical-rl">あたしがあたしということを思い出したのはほんの1年前だった</text>
<text x="135" y="20" writing-mode="vertical-rl">恐怖の大王が落ちるとか言われてた日</text>
<text x="104" y="20" writing-mode="vertical-rl">バカバカバカなにが恐怖の大王だどうせなら落ちてくれればよかった</text>
<text x="73" y="20" writing-mode="vertical-rl">あたしはこの24年間、記憶を失っていた。</text>
<text x="42" y="20" writing-mode="vertical-rl">覚えていたのは名前ぐらいだった。</text>
</g>
</svg>
